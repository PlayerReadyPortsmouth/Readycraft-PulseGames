# Enable only after proxy/backend compatibility checks. Same private secret on the proxy.
enabled: false
bridge-secret: ''
chat:
  enabled: false
  global-by-default: true
  # Send local chat to each viewer as an unsigned system message (fixes signed-chat hiding behind Velocity/Floodgate).
  local-system-delivery: false
  # Only used if the event's own renderer fails; <name> and <message> are literal substitutions.
  local-format: '<name>: <message>'
queues:
  enabled: false
chat-games:
  enabled: false
  minimum-players: 2
  interval-seconds: 300
  external-provider-plugins: [ChatGames, ChatGames-Premium, PulseAddon]
# Sends TPS/MSPT/online and afk/hidden/in-match flags to the proxy for its network tab list.
tab-status:
  enabled: false
  afk-metadata-keys: [afk, AFK]
# Role tags shown before names in local chat (MiniMessage, text capped at 6 characters; blank removes a tag).
# Roles come from the LuckPerms meta key pulse.role; a style from pulse.namestyle.
#tags:
#  dev: '<aqua>DEV</aqua>'
# /namestyle picker (writes LuckPerms user meta pulse.namestyle) and the staff /rolemenu (asks the proxy to run /role as the player).
namestyle:
  enabled: true
rolemenu:
  enabled: true
# Join and leave lines now come from the proxy (presence.* in network.properties). true blanks this server's own lines
# so players see one. Set false if the proxy's presence.enabled is false.
presence:
  suppress-local: true

# /admin hub for Dev, Admin and Staff; sections appear only for plugins present on this server.
admin:
  enabled: true
  # Minimum LuckPerms group per /admin area: staff (dev, admin and staff) or admin (dev and admin). Defaults shown; remove a line to use the default.
  # Whitelist remove/on/off, and announce, styles and tab, are dev/admin by default.
  areas:
    players: {min-group: staff}
    roles: {min-group: staff}
    nick: {min-group: staff}
    identity: {min-group: staff}
    whitelist: {min-group: staff}
    games: {min-group: staff}
    survival: {min-group: staff}
    hunt: {min-group: staff}
    server: {min-group: staff}
    styles: {min-group: admin}
    tab: {min-group: admin}
    announce: {min-group: admin}
