name: PulseNetwork
version: '0.2.1'
authors: ['AurorasChaos (on behalf of Player Ready)']
main: uk.co.playerready.pulsenetwork.PaperBridge
api-version: '1.21'
softdepend: [PulseGames, AdvancedChat, ChatGames, EssentialsChat, PulseAddon, LuckPerms]
commands:
  globalchat:
    description: Toggle relaying your normal public chat across the network
    aliases: [g]
    permission: pulsenetwork.chat
  localchat:
    description: Keep your normal chat on this server
  namestyle:
    description: Pick a name style you have unlocked
    aliases: [namecolour, namecolor]
  rolemenu:
    description: Staff menu for giving and taking away network roles
permissions:
  pulsenetwork.chat:
    default: true
