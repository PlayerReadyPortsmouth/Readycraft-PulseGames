# Based on OldCombatMechanics 2.7.0 config, Mozilla Public License 2.0.
# Source: https://github.com/kernitus/BukkitOldCombatMechanics
# Keep non-PvP worlds modern. PulseGames selects pulse-classic for PvP participants.
# Shield fallback chosen for Java/Bedrock interoperability; client acceptance pending.
always_enabled_modules: []
disabled_modules:
- attack-range
- chorus-fruit
- disable-crafting
- disable-offhand
- old-brewing-stand
- old-burn-delay
- update-checker
modesets:
  pulse-modern: []
  pulse-classic:
  - attack-frequency
  - disable-attack-cooldown
  - disable-attack-sounds
  - disable-enderpearl-cooldown
  - disable-sword-sweep
  - disable-sword-sweep-particles
  - fishing-rod-velocity
  - old-armour-durability
  - old-armour-strength
  - old-critical-hits
  - old-fishing-knockback
  - old-golden-apples
  - old-player-knockback
  - old-player-regen
  - old-potion-effects
  - old-potion-throwing
  - old-tool-damage
  - projectile-knockback
  - shield-damage-reduction
  - sword-blocking
worlds:
  __default__:
  - pulse-modern
  - pulse-classic
mode-permissions:
  enabled: false
mode-messages:
  mode-status: ''
  message-usage: '&eYou can use &c/ocm mode <modeset> [player] &eto change modeset'
  invalid-modeset: '&cPlease specify a valid modeset!'
  no-permission-modeset: '&cYou do not have permission to use that modeset!'
  invalid-player: '&cPlease specify a valid player!'
  mode-set: '&2Set modeset to &7%s'
disable-attack-cooldown:
  generic-attack-speed: 40
  held-item-attack-speeds:
    TRIDENT: 1.1
    MACE: 0.6
    WOODEN_SPEAR: 1.54
    GOLDEN_SPEAR: 1.05
    STONE_SPEAR: 1.33
    COPPER_SPEAR: 1.18
    IRON_SPEAR: 1.05
    DIAMOND_SPEAR: 0.95
    NETHERITE_SPEAR: 0.87
attack-frequency:
  playerDelay: 20
  mobDelay: 20
attack-range:
  min-range: 0.0
  max-range: 3.0
  min-creative-range: 0.0
  max-creative-range: 4.0
  hitbox-margin: 0.1
  mob-factor: 1.0
old-tool-damage:
  old-sharpness: true
  tooltip:
    enabled: true
    prefix: 'OCM Damage:'
  damages:
    GOLD_AXE: 4
    WOOD_AXE: 4
    STONE_AXE: 5
    IRON_AXE: 6
    DIAMOND_AXE: 7
    NETHERITE_AXE: 8
    COPPER_AXE: 6
    GOLD_SPADE: 2
    WOOD_SPADE: 2
    STONE_SPADE: 3
    IRON_SPADE: 4
    DIAMOND_SPADE: 5
    NETHERITE_SPADE: 6
    COPPER_SPADE: 3
    GOLD_SWORD: 5
    WOOD_SWORD: 5
    STONE_SWORD: 6
    IRON_SWORD: 7
    DIAMOND_SWORD: 8
    NETHERITE_SWORD: 9
    COPPER_SWORD: 6
    GOLD_PICKAXE: 3
    WOOD_PICKAXE: 3
    STONE_PICKAXE: 4
    IRON_PICKAXE: 5
    DIAMOND_PICKAXE: 6
    NETHERITE_PICKAXE: 7
    COPPER_PICKAXE: 4
    GOLD_HOE: 1
    WOOD_HOE: 1
    STONE_HOE: 1
    IRON_HOE: 1
    DIAMOND_HOE: 1
    NETHERITE_HOE: 1
    COPPER_HOE: 1
    TRIDENT: 8
    TRIDENT_THROWN: 8
    MACE: 6
old-critical-hits:
  world: []
  multiplier: 1.5
  allow-sprinting: true
old-player-regen:
  interval: 4000
  amount: 1
  exhaustion: 3
old-armour-strength:
  randomness: true
old-armour-durability:
  reduction: 1
shield-damage-reduction:
  generalDamageReductionAmount: 1
  generalDamageReductionPercentage: 50
  projectileDamageReductionAmount: 1
  projectileDamageReductionPercentage: 50
sword-blocking:
  paper-animation: false
  restoreDelay: 40
  use-permission: false
disable-sword-sweep: null
disable-sword-sweep-particles: null
old-player-knockback:
  knockback-horizontal: 0.4
  knockback-friction: 2.0
  knockback-vertical: 0.4
  knockback-vertical-limit: 0.4
  knockback-extra-horizontal: 0.5
  knockback-extra-vertical: 0.1
  enable-knockback-resistance: false
old-fishing-knockback:
  damage: 0.0001
  cancelDraggingIn: players
  knockbackNonPlayerEntities: false
  hitCooldown: 1000
fishing-rod-velocity:
  gravity: 0.04
projectile-knockback:
  damage:
    snowball: 0.0001
    egg: 0.0001
    ender_pearl: 0.0001
old-golden-apples:
  cooldown:
    normal: 0
    message-normal: '&ePlease wait %seconds%s before eating another golden apple.'
    enchanted: 0
    message-enchanted: '&ePlease wait %seconds%s before eating another enchanted golden
      apple.'
    is-shared: false
  enchanted-golden-apple-crafting: true
  old-potion-effects: true
  golden-apple-effects:
    regeneration:
      duration: 5
      amplifier: 1
    absorption:
      duration: 120
      amplifier: 0
  enchanted-golden-apple-effects:
    regeneration:
      duration: 30
      amplifier: 4
    resistance:
      duration: 300
      amplifier: 0
    fire_resistance:
      duration: 300
      amplifier: 0
    absorption:
      duration: 120
      amplifier: 0
  no-conflict-mode: false
old-potion-throwing:
  launch-speed: 0.5
  pitch-offset: -20.0
  yaw-offset: 0.0
  sideways-offset: 0.16
  vertical-offset: -0.1
  inherit-player-velocity: false
  gravity: 0.05
old-potion-effects:
  potion-durations:
    drinkable:
      regeneration: 45
      strong_regeneration: 22
      long_regeneration: 120
      swiftness: 180
      strong_swiftness: 90
      long_swiftness: 480
      fire_resistance: 180
      long_fire_resistance: 480
      poison: 45
      strong_poison: 22
      long_poison: 120
      night_vision: 180
      long_night_vision: 480
      weakness: 90
      long_weakness: 240
      strength: 180
      strong_strength: 90
      long_strength: 480
      slowness: 90
      long_slowness: 240
      leaping: 180
      strong_leaping: 90
      long_leaping: 480
      water_breathing: 180
      long_water_breathing: 480
      invisibility: 180
      long_invisibility: 480
      luck: 300
      slow_falling: 90
      long_slow_falling: 240
    splash:
      regeneration: 33
      strong_regeneration: 16
      long_regeneration: 90
      swiftness: 135
      strong_swiftness: 67
      long_swiftness: 360
      fire_resistance: 135
      long_fire_resistance: 360
      poison: 33
      strong_poison: 16
      long_poison: 90
      night_vision: 180
      long_night_vision: 480
      weakness: 90
      long_weakness: 240
      strength: 135
      strong_strength: 67
      long_strength: 360
      slowness: 67
      long_slowness: 180
      leaping: 135
      strong_leaping: 67
      long_leaping: 360
      water_breathing: 135
      long_water_breathing: 360
      invisibility: 135
      long_invisibility: 360
      luck: 300
      slow_falling: 90
      long_slow_falling: 240
  strength:
    modifier: 1.3
    multiplier: true
    addend: true
  weakness:
    modifier: -0.5
    multiplier: false
disable-crafting:
  denied:
  - shield
  showMessage: true
  message: '&cYou cannot craft that item!'
disable-offhand:
  whitelist: true
  items: []
  denied-message: '&cOff-hand is disabled'
old-brewing-stand: null
disable-enderpearl-cooldown:
  cooldown: 0
  showMessage: true
  message: '&cYou must wait &7%ds&c before using an enderpearl again!'
chorus-fruit:
  max-teleportation-distance: 8
  prevent-eating: false
  saturation-value: 2.4
  hunger-value: 4
old-burn-delay:
  fire-ticks: 120
disable-attack-sounds:
  blocked-sound-names:
  - ENTITY_PLAYER_ATTACK_STRONG
  - ENTITY_PLAYER_ATTACK_SWEEP
  - ENTITY_PLAYER_ATTACK_NODAMAGE
  - ENTITY_PLAYER_ATTACK_KNOCKBACK
  - ENTITY_PLAYER_ATTACK_CRIT
  - ENTITY_PLAYER_ATTACK_WEAK
message-prefix: '&6[OCM]&r'
update-checker:
  auto-update: false
force-below-1-18-1-config-upgrade: false
command-completer:
  enabled: true
debug:
  enabled: false
config-version: 75
