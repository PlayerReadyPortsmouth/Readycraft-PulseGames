# PulseGames core configuration

lobby:
  # Set in-game with /pulse setlobby. Must be the name of a world that actually
  # exists on this server, otherwise every lobby guard (damage, void safety,
  # hub block protection) has nothing to match against.
  world: world
  location: "0.5,100,0.5,0,0"
  # Give the game-menu compass on lobby join
  give-menu-item: true

ui:
  # Bedrock (Floodgate) players get forms for the game list, mode picker and confirms; false = chest menus for all.
  bedrock-forms: true
  # How often open game lists and mode pickers update their waiting counts (ticks).
  refresh-ticks: 40

instances:
  # Hard cap on concurrently running game instances (worlds) on this server.
  max-concurrent: 20
  # Prefix for cloned instance world folders.
  world-prefix: pulse_

build-worlds:
  # Save and unload editing worlds after the last player leaves; 0 disables.
  idle-unload-seconds: 15
  # Permanent exceptions (the lobby and active matches are always protected).
  keep-loaded: []

limits:
  # Blocks one shape primitive (shapes/*.json, blueprint "shapes") may place.
  # Geometry is computed on the main thread, so an unbounded radius hangs the server.
  max-shape-blocks: 2000000

countdown:
  # Seconds in the waiting lobby once min players is reached.
  lobby-seconds: 30
  # When the arena is full, shorten the countdown to this.
  full-seconds: 10
  # Countdown once every human in the waiting room has clicked the ready item.
  ready-seconds: 5

party:
  max-size: 8
  invite-expiry-seconds: 60
  # Extra words /party chat refuses, on top of the built-in list (links, emails and phone numbers are always refused).
  # Every party message is also logged to the console.
  chat-blocklist: []

end:
  # Seconds to celebrate before players are returned to the lobby.
  celebrate-seconds: 10

shop:
  # Buying anything priced at or above this asks "are you sure?" first (the 2x booster always asks).
  confirm-at: 500

economy:
  # Pulse Tokens earned for...
  win-reward: 50
  participation-reward: 10
  kill-reward: 5
  # Placement bonuses for non-winners, on top of participation. A round with no declared
  # winner (draw, or time up) pays its joint-first players the second-place amount.
  second-place-reward: 20
  third-place-reward: 10
  # Smallest field (bots included) in which placement bonuses are paid.
  placement-min-players: 4
  # Most tokens kills can earn in one match, so kills cannot out-earn a win.
  kill-token-cap: 25
  # Kills on the same victim beyond this many per match earn no tokens and do not count toward a win by default.
  same-victim-kill-cap: 3
  # A round that ends only because everyone else left counts as a ranked win only if it ran this long
  # (and, in kill-target games, the winner has half the target in non-repeat kills).
  min-ranked-seconds: 60
  # Extra tokens on a player's first win each day.
  first-win-bonus: 30
  # Win streak: step tokens per win beyond the first, up to max (announced at 3, 5 and 10).
  streak-bonus-step: 5
  streak-bonus-max: 25
  # ...being online (every N minutes)
  playtime-bonus: 25
  playtime-interval-minutes: 15
  # ...first login of the day
  daily-bonus: 100

spectator:
  # Players who are out of a round get a hotbar (watch a player, queue next game, reactions)
  # and fly as invisible ghosts. false = old behaviour: vanilla spectator mode, no hotbar.
  hotbar: true

# Experimental games become queueable only when named here; add maps before enabling.
games:
  preview: []
  # Explicit public game access, independent of other trial features.
  public: []

# Owner: Aurora / ReadyCraft. Review: 2026-10-25.
# Keep as an operational switch; enable only on tested arenas and compatible Citizens.
bots:
  enabled: false
  # Each arena must also set settings.bots-enabled: true.
  # adaptive, easy, normal or hard; arena settings.bot-difficulty overrides this.
  # Adaptive uses separate recent practice results; no changes to ranked stats/rewards.
  difficulty: adaptive
  wait-seconds: 30
  # Maps with up to four seats fill completely; larger maps allow floor(maximum / 2) bots.
  # Bots sit alongside humans within map capacity. Humans reclaim waiting seats; hard caps also apply.
  max-per-match: 31
  max-total: 64
  # Human-like PvP combat for Duels (classic/op/sumo), KitPvP and KOTH bots. Every key is optional.
  combat:
    # Sprint while closing and on the first hit, released for one think after each hit (w-tap).
    # Sprint knockback on a Citizens NPC is unverified in-game: switch off if bots feel wrong.
    sprint: true
    # Circle the opponent in melee range instead of standing still (short, ledge-checked steps).
    strafe: true
    # Eat golden apples, shoot a bow from 8+ blocks, throw ender pearls from the kit (never beyond what the kit holds).
    kit-use: true
    # Back off and eat below tiers.<tier>.retreat-health, only while holding a golden apple.
    retreat: true
    # Per tier overrides of the shipped defaults (easy / normal / hard); shown here at their defaults.
    # melee-delay-ticks / hit-chance / path-interval-ticks apply to the shared PvP core only.
    tiers:
      easy:
        melee-delay-ticks: 28      # ticks between swings
        hit-chance: 45             # percent of swings that connect (a miss still swings)
        projectile-delay-ticks: 40 # ticks between arrows
        path-interval-ticks: 30
        aim-error-degrees: 6.0     # how far off the bot looks; re-sampled every 1.5-3 s
        strafe-bias: 0.35          # 0..1 how often a strafe cycle circles rather than holds
        sprint-chance: 0.40
        jump-crit-chance: 0.0      # jump-crit and jump-reset; 0 = never jumps
        reaction-jitter-ticks: 5   # 0..5 extra reaction time on each engagement
        retreat-health: 0.20       # fraction of max health
      normal:
        melee-delay-ticks: 14
        hit-chance: 80
        projectile-delay-ticks: 20
        path-interval-ticks: 20
        aim-error-degrees: 3.0
        strafe-bias: 0.70
        sprint-chance: 0.75
        jump-crit-chance: 0.25
        reaction-jitter-ticks: 4
        retreat-health: 0.30
      hard:
        melee-delay-ticks: 10
        hit-chance: 95
        projectile-delay-ticks: 12
        path-interval-ticks: 10
        aim-error-degrees: 0.5
        strafe-bias: 0.90
        sprint-chance: 1.0
        jump-crit-chance: 0.60
        reaction-jitter-ticks: 2
        retreat-health: 0.30

# Bedwars bot behaviour (only matters when bots.enabled and the arena allows bots). All values optional; defaults shown.
# Owner Aurora / ReadyCraft; review 2026-11-26.
bedwars:
  bots:
    pace:
      # How many cells ahead a bot aims while walking. 1 = old step-by-step feel; 3 = continuous.
      look-ahead-cells: 3
    bridge:
      # Ticks between placed bridge blocks (bots think every 5 ticks, so 5 is one block per think).
      place-ticks: 5
      # Sneak while placing at an edge, like a player bridging.
      sneak: true
      # Longest void gap, in cells, a bot will plan a bridge across when choosing a bed.
      max-gap: 24
    roles:
      # One guard per team (a lone bot guards only for solo-guard-seconds); the rest gather, then attack.
      attack-start-seconds: 150
      solo-guard-seconds: 90
      # Attackers may leave for diamonds from this game time.
      mid-game-seconds: 300
    resources:
      diamond-trip-seconds: 40
      diamonds-wanted: 4
      # Attackers low on iron and gold return to the team generator this often, for gather-hold-seconds.
      gather-interval-seconds: 60
      gather-hold-seconds: 12
      # Bots buy only within this many blocks of their generator (except wool when nearly out).
      spend-radius: 14
    defence:
      # Rings of blocks around the bed (1-3). Rebuilt when broken.
      layers: 2
      guard-radius: 6
      # An enemy this close to the bed makes the guard (and nearby teammates) run to it.
      alert-radius: 16
      place-ticks: 10
      # Most blocks one bot will place on defence over a match (bridging is not counted).
      block-cap: 192
    attack:
      # How often a bot re-chooses which enemy bed to go for.
      reassess-seconds: 15
    fireball:
      enabled: true
      min-range: 3
      max-range: 9
      cooldown-ticks: 60
    pearl:
      # Throw an ender pearl towards home at or below this many health points (20 = full).
      escape-health: 6.0
    # Eat a golden apple at or below this many health points.
    apple-health: 10.0

# PulseKarts bot driving. Owner: Aurora / ReadyCraft. Review: 2026-11-26.
# Every value is clamped to a safe range; a missing or zero value uses the default shown.
karts:
  bots:
    # Top speed as a fraction of the kart's physics maximum (12 blocks/s x style speed).
    speed-fraction:
      easy: 0.78
      normal: 0.90
      hard: 0.98
    # Target speed (blocks/s) for a bend over 25, 55 and 100 degrees; scaled 0.85 / 1.0 / 1.1 by Easy / Normal / Hard.
    corner-speeds: [8.0, 5.5, 3.0]
    # Quiet rubber-banding against the nearest human by race position. Bots behind a human gain up to
    # max-bonus, bots comfortably ahead lose up to max-penalty (Easy leans to help, Hard to pressure).
    # The effect ramps from start-blocks to full-blocks. A human further ahead than range-blocks is
    # not "nearby", so a runaway leader is never throttled. Bots never exceed the physics maximum.
    rubber-band:
      enabled: true
      max-bonus: 0.08
      max-penalty: 0.08
      start-blocks: 25
      full-blocks: 100
      range-blocks: 150
    # Racing line: each bot sits up to this many blocks either side of the route (varies by bot and lap).
    lane-width: 1.5
    # A kart within this many blocks ahead makes a bot swap to the clear lane to overtake.
    overtake-range: 6
    # Longest drift per tier in ticks (20 = 1 s). Mini-turbo needs 20, super 50.
    drift-max-ticks:
      easy: 22
      normal: 40
      hard: 50
    # Share of Easy bots that ever try a (mini) drift.
    easy-drifter-share: 0.25
    # BALANCE: when true, bots in the back placing tier may roll Star and Bullet for catch-up.
    # When false they only get them while a human holds one (the old rule).
    strong-items-when-behind: true

# Trial access for preview games, queue bots and modeled Prop Hunt. UUIDs only.
# Owner Aurora / ReadyCraft; review 2026-10-25. Empty list grants nobody access.
features:
  broad: false
  canary-players: []

# Requires PulseContent minigames API v1 and approved no-hitbox model IDs.
# Owner Aurora / ReadyCraft; review 2026-10-25; keep off until mixed-client acceptance.
content:
  prophunt:
    enabled: false
    props: []
    # Selectable compact props and grid locks; requires PulseContent Paper 0.3.3 prop visuals.
    # Models must match cube/head hit dimensions and be centred at the feet.
    # Per-arena prop-powers, decoy and sprint/pulse settings are documented in docs/PROP-HUNT.md.
    # Per-arena `real-blocks: true` (arena settings, default off) makes locked hiders and decoys real blocks.
    block-snapping: false
    block-palette:
      hay:
        name: Hay bale
        material: HAY_BLOCK
        model: readycraft:prop_hay
      workbench:
        name: Crafting table
        material: CRAFTING_TABLE
        model: readycraft:prop_workbench
      bookshelf:
        name: Bookshelf
        material: BOOKSHELF
        model: readycraft:prop_bookshelf
      melon:
        name: Melon
        material: MELON
        model: readycraft:prop_melon
      pumpkin:
        name: Pumpkin
        material: PUMPKIN
        model: readycraft:prop_pumpkin
      log:
        name: Oak log
        material: OAK_LOG
        model: readycraft:prop_log
      stone:
        name: Stone
        material: STONE
        model: readycraft:prop_stone
      bricks:
        name: Bricks
        material: BRICKS
        model: readycraft:prop_bricks
      moss:
        name: Moss
        material: MOSS_BLOCK
        model: readycraft:prop_moss
      head:
        name: Player head
        material: PLAYER_HEAD
        model: readycraft:prop_head

# Enable after installing OldCombatMechanics 2.7.0-ready.1 and docs/combat/ocm-config.yml.
# Uses the classic preset for PvP participants, modern for other worlds/games.
combat:
  classic-pvp: false

# Enable after the paired PulseContent progression schema/config has been applied.
# Owner: AurorasChaos; review 2026-11-14; retain as collection/delivery pause until acceptance.
progression:
  enabled: false
  # XP levels across every game ([12] prefix, /level, /wardrobe). XP comes from eligible rounds and challenges only.
  levels-enabled: true
  # Tell the lobby (never other servers) when someone reaches level 5, 10, 15 ...
  announce-levels: true
  event-id: "" # Stable event ID; only matches completed during this configured event count.

# Quick Play hotbar item/menu button and the daily featured game.
quickplay:
  enabled: true
  featured:
    # A game id to pin today's featured game; empty rotates by date through the pool.
    override: ""
    # Rotation pool; empty means every playable game with an arena.
    games: []
    # Match-token multiplier in the featured game (stacks with a personal booster).
    token-multiplier: 1.5

# Daily challenges kept in the plugin's own engagement.yml (no SQL needed).
# type: DISTINCT_GAMES | WINS | SURVIVE_SECONDS; game is optional (id) and filters WINS/SURVIVE_SECONDS.
challenges:
  enabled: true
  daily:
    play-three:
      name: "Play three different games"
      type: DISTINCT_GAMES
      target: 3
      reward: 40
      xp: 40   # XP towards your level (0 for none)
    win-a-round:
      name: "Win a round of anything"
      type: WINS
      target: 1
      reward: 30
      xp: 30
    survive-avalanche:
      name: "Survive 90 seconds in Avalanche"
      type: SURVIVE_SECONDS
      game: avalanche
      target: 90
      reward: 30
      xp: 30

# Weekly top-three board (/top): tokens paid at the Monday reset to 1st, 2nd and 3rd.
leaderboard:
  weekly-rewards: [100, 60, 30]

debug:
  # Log sidebar line operations once a second (new method vs the old reset-and-rewrite). Leave off in normal play.
  sidebar: false

engagement:
  # One action-bar line on join when a daily challenge, the first-win bonus or a featured-game bonus is waiting.
  join-hint: true
