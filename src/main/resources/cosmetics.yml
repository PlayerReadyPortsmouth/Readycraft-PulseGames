# Extra PulseGames cosmetics (data, not code). The thirteen original items live in the plugin.
# Every effect is vanilla only: one particle burst and/or one sound.
#
# Each entry:
#   slot:        trail | kill_effect | win_effect | emote (spectator reactions) | kit
#   name, icon (a vanilla Material), description
#   price:       tokens to buy it, OR
#   level:       the player level that unlocks it for free (a multiple of 5, up to 100, one item per level)
#                (use exactly one of price and level)
#   effect:      particle (no data-carrying particles), count (1-60), spread, speed, height, sound
#                (a minecraft: key), volume (0-1), pitch (0.5-2)
# A broken entry is skipped with a warning in the console; the others still load.
# Delete this file to get the latest list back after an update.
