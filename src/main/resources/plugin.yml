name: PulseGames
authors: ['AurorasChaos (on behalf of Player Ready)']
version: "${version}"
main: uk.co.playerready.pulsegames.PulseGamesPlugin
api-version: '1.21'
softdepend: [floodgate, Citizens, PulseContent, OldCombatMechanics, LuckPerms]
description: Multi-instance minigame engine for the Readycraft network.
commands:
  play:
    description: Join a minigame.
    usage: /play <game> [mode]
  party:
    description: Manage your party.
    usage: /party <invite|accept|deny|leave|disband|list|chat|invites|private|spectate> [player|message]
    aliases: [p]
  lobby:
    description: Return to the main lobby.
    aliases: [hub]
  stats:
    description: View your minigame stats.
  duels:
    description: Choose combat style, discipline, team size and your Duels kit.
  ranked:
    description: Ranked Duels ratings, divisions, boards and queue.
    usage: /ranked [queue <kit>|leave|history]
  pulsekits:
    description: Choose your next KitPvP loadout.
    aliases: [kits]
  shop:
    description: Open the token shop.
    aliases: [tokens, cosmetics]
  level:
    description: See your level, XP and next unlock.
    aliases: [xp, levels]
  wardrobe:
    description: Browse your cosmetics and what you can unlock or buy.
  challenges:
    description: View competitive minigame challenges and cosmetic rewards.
    usage: /challenges
  top:
    description: Weekly top three wins board.
    usage: /top [game]
    aliases: [leaderboard]
  results:
    description: View your latest match and choose what to do next.
    usage: /results [again|games|return]
  event:
    description: Tournaments - see the next ones, join, watch the bracket or see the last results.
    usage: /event [join|leave|bracket|results]
    aliases: [tournament]
  admin-route:
    description: Internal. Hub route for the PulseGames admin area; use /admin games instead.
    usage: /admin-route games [verb] [args]
    permission: pulsegames.admin
  pulse:
    description: Retiring alias of /admin games, kept hidden for one release.
    usage: /admin games <setup|maps|practice|event|bots|types|matches|start|end|setlobby|reload>
    permission: pulsegames.admin

permissions:
  pulsegames.admin:
    description: Parent of every PulseGames admin node.
    default: op
    children:
      pulsegames.admin.games: true
      pulsegames.admin.matches: true
      pulsegames.admin.players: true
      pulsegames.admin.events: true
      pulsegames.admin.bots: true
      pulsegames.admin.server: true
      pulsegames.admin.maps: true
      pulsegames.admin.setup: true
  pulsegames.admin.games:
    description: Registered games, arenas, worlds, shapes and lobby placements.
    default: false
  pulsegames.admin.matches:
    description: List, force-start and force-end running matches.
    default: false
  pulsegames.admin.players:
    description: Progression verbs (XP, level, name styles).
    default: false
  pulsegames.admin.events:
    description: Start, list and cancel tournaments and practice runs.
    default: false
  pulsegames.admin.bots:
    description: Bot status and inspection.
    default: false
  pulsegames.admin.server:
    description: The PulseGames admin menu, reload and set lobby.
    default: false
  pulsegames.admin.maps:
    description: Map readiness board, review and export.
    default: false
  pulsegames.admin.setup:
    description: Arena setup sessions.
    default: false
  pulsegames.maps.approve:
    description: Record human visual map review evidence separately from map setup access.
    default: op
